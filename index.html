<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/webp" href="logo.webp">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A 12-axis political compass measured by intention — Mind, Suggest, Enforce — not number grading. Compare against leaders, thinkers and fictional characters, in 2D or 3D.">
  <meta name="theme-color" content="#050505">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://compass.carino.systems/">
  <meta property="og:title" content="Compass — 12-Axis Political Compass">
  <meta property="og:description" content="A 12-axis political compass measured by intention, not number grading. Build yours and share it by link.">
  <meta property="og:image" content="https://compass.carino.systems/logo.webp">
  <title>Compass — 12-Axis Political Compass</title>
  <link rel="stylesheet" href="fonts/carino-fonts.css">
  <style>
    :root {
      --bg:     #050505;
      --lcd:    #0d0d0d;
      --dim:    #4b4b52;
      --mid:    #52525b;
      --border: #262626;
      --gold:   #eab308;
      --active: #eab308;
      --bright: #fbbf24;
      --mind:    #22c55e;
      --suggest: #eab308;
      --enforce: #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── CS Header ── */
    .cs-header {
      height: 70px; flex-shrink: 0;
      background: linear-gradient(180deg, #0f0f0f 0%, #050505 100%);
      border-bottom: 1px solid #262626;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; gap: 12px; z-index: 100;
      font-family: 'IBM Plex Sans', sans-serif;
    }
    .cs-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .cs-vdiv { width: 1px; height: 22px; background: #262626; flex-shrink: 0; }
    .cs-btn {
      display: flex; align-items: center; gap: 5px;
      background: transparent; border: 1px solid #262626; color: #a3a3a3;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 0 10px; height: 32px; border-radius: 4px; cursor: pointer; transition: 0.2s; white-space: nowrap;
    }
    .cs-btn:hover { border-color: #eab308; color: #eab308; background: rgba(234,179,8,0.05); }

    /* ── Full-page layout ── */
    .watch {
      width: 100%;
      height: calc(100vh - 70px);
      height: calc(100dvh - 70px);
      padding: 10px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }

    /* Header */
    .hdr {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      border-bottom: 1px solid var(--dim);
      padding-bottom: 4px;
      flex-shrink: 0;
      gap: 8px;
    }
    .home-hint {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.62rem, 1.1vw, 0.76rem);
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40vw;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .home-hint.flash { color: var(--bright); }
    .hdr-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .hdr-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.6rem, 1.2vw, 0.72rem);
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Main content ── */
    .body {
      flex: 1;
      display: flex;
      gap: 10px;
      min-height: 0;
    }

    .chart-panel {
      width: 44%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas { display: block; touch-action: none; }
    canvas:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; border-radius: 4px; }

    /* ── Sliders panel ── */
    .sliders {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .slider-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      min-height: 0;
    }
    .ax {
      display: grid;
      grid-template-columns: minmax(48px, 24%) 1fr minmax(48px, 24%);
      align-items: center;
      gap: 5px;
    }
    /* Pole labels wrap rather than truncate: the pole names ARE the axis, so
       an ellipsis loses the meaning. English mostly fits on one line; es/pt/ru
       compounds (МУЛЬТИКУЛЬТУРАЛИЗМ, ASSIMILACIONISTA) need a second. The grid
       centres rows vertically, so a taller label stays aligned with its track. */
    .pole {
      font-size: clamp(0.78rem, 1.45vw, 1rem);
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: normal;
      overflow-wrap: break-word;
      hyphens: auto;            /* documentElement.lang is set by carino-lang.js */
      line-height: 1.12;
      transition: color 0.12s;
    }
    .pole.l   { text-align: right; }
    .pole.r   { text-align: left;  }
    .pole.lit { color: var(--bright); } /* overridden per-level by JS */
    .sc {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1px;
    }
    /* Label row: axis name left, live position label right */
    .an {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
      cursor: help;
      user-select: none;
    }
    .an:hover .ax-name { color: var(--mid); }
    .ax-name {
      font-size: clamp(0.58rem, 0.98vw, 0.7rem);
      color: var(--dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .ax-pos {
      font-size: clamp(0.6rem, 1.02vw, 0.74rem);
      color: var(--active);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Track */
    .tw { position: relative; width: 100%; height: 26px; }
    .ticks {
      position: absolute;
      left: 5px; right: 5px; top: 0; bottom: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }
    .ticks span { display: block; width: 1px; height: 7px; background: var(--mid); flex-shrink: 0; }
    .ticks span:nth-child(4) { height: 11px; background: #6a5a24; } /* center (Don't Mind) */
    .tw.enforce::after {
      content: '';
      position: absolute;
      bottom: 1px; left: 4px; right: 4px;
      height: 2px;
      background: var(--enforce);
      pointer-events: none;
    }
    .ax.chart-hover { background: rgba(234, 179, 8, 0.07); border-radius: 6px; }
    .ax.chart-hover .ax-name { color: var(--active); }

    input[type="range"] {
      position: absolute;
      inset: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      background-image: linear-gradient(
        transparent 0%, transparent calc(50% - 1px),
        var(--mid) calc(50% - 1px), var(--mid) calc(50% + 1px),
        transparent calc(50% + 1px), transparent 100%
      );
      cursor: pointer;
      outline: none;
      z-index: 1;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--active);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1px rgba(234,179,8,.5), 0 2px 5px rgba(0,0,0,.55);
      cursor: pointer;
      transition: transform 0.1s;
    }
    input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(234,179,8,.35); }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--active);
      border: 2px solid var(--bg);
      box-shadow: 0 2px 5px rgba(0,0,0,.55);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-track { height: 2px; background: var(--mid); }

    /* ── Axis info bar (now lives in header center) ── */
    .axis-info {
      font-size: clamp(0.6rem, 0.9vw, 0.72rem);
      color: #a3a3a3;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }
    .axis-info.active { color: var(--bright); }

    /* ── "for reference only" warning chip ── */
    .warn-chip {
      font-size: clamp(0.5rem, 0.95vw, 0.62rem);
      color: var(--suggest);
      border: 1px solid var(--suggest);
      border-radius: 4px;
      padding: 1px 6px;
      letter-spacing: 0.1em;
      white-space: nowrap;
      cursor: help;
      opacity: 0.85;
      font-family: 'IBM Plex Mono', monospace;
    }
    .warn-chip:hover { opacity: 1; }

    /* ── Profiles overlay ── */
    .prof-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .prof-overlay.open { display: flex; }

    .prof-panel {
      background: var(--lcd);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      width: min(94vw, 860px);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .prof-panel-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 12px 6px;
      border-bottom: 1px solid var(--dim);
      flex-shrink: 0;
    }
    .prof-panel-hdr span {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: var(--active);
      letter-spacing: 0.18em;
    }
    .prof-panel-hdr small {
      font-size: clamp(0.55rem, 1vw, 0.65rem);
      color: var(--dim);
      letter-spacing: 0.08em;
    }
    .prof-close {
      background: none;
      border: 1px solid var(--border);
      color: #a3a3a3;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.12s;
    }
    .prof-close:hover { border-color: var(--enforce); color: var(--enforce); }

    .prof-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 12px 0;
      flex-shrink: 0;
    }
    .prof-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: #a3a3a3;
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.58rem, 1vw, 0.68rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .prof-tab small { color: var(--dim); margin-left: 5px; }
    .prof-tab:hover { border-color: var(--gold); color: var(--gold); }
    .prof-tab.active { border-color: var(--gold); color: var(--gold); background: rgba(234,179,8,0.08); }
    .prof-search-wrap { padding: 8px 12px 0; flex-shrink: 0; }
    .prof-search-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    .prof-search-wrap input:focus { border-color: var(--gold); }
    .prof-search-wrap input::placeholder { color: var(--dim); }
    .prof-empty {
      color: var(--dim);
      font-size: 0.78rem;
      padding: 8px 2px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .prof-body {
      overflow-y: auto;
      padding: 10px 12px;
    }
    .prof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px;
    }

    .prof-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      color: #fff;
      font-family: inherit;
      font-size: clamp(0.74rem, 1.2vw, 0.84rem);
      letter-spacing: 0.005em;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.12s;
      text-align: left;
    }
    .prof-card small {
      display: block;
      font-size: 0.76em;
      color: #666;
      letter-spacing: 0.01em;
      text-transform: none;
      margin-top: 1px;
    }
    .prof-card:hover {
      border-color: var(--bright);
      color: var(--bright);
      background: rgba(234, 179, 8, 0.08);
    }
    .prof-card:hover small { color: var(--mid); }

    /* ── Portrait / Mobile ── */
    @media (orientation: portrait) {
      .watch { height: calc(100dvh - 70px); height: calc(100vh - 70px); padding: 6px 8px; }
      .body  { flex-direction: column; }
      .chart-panel { width: 100%; height: 38%; flex-shrink: 0; }
      .tw    { height: 20px; }
      .home-hint { max-width: 34vw; }
      .hdr-tag   { font-size: clamp(0.82rem, 3vw, 0.98rem); }
      .pole      { font-size: clamp(0.72rem, 2.6vw, 0.9rem); }
      .ax-name   { font-size: clamp(0.55rem, 1.8vw, 0.66rem); }
      .ax-pos    { font-size: clamp(0.57rem, 1.9vw, 0.7rem); }
      .prof-panel { width: 100vw; max-height: 92vh; }
    }

    @media (orientation: landscape) and (max-height: 460px) {
      .watch { height: calc(100vh - 70px); height: calc(100dvh - 70px); padding: 4px 6px; }
      .tw    { height: 16px; }
      .ax-name { display: none; }
      .ax-pos  { font-size: clamp(0.6rem, 1.3vh, 0.74rem); }
      .pole  { font-size: clamp(0.65rem, 1.3vh, 0.8rem); }
      .warn-chip { display: none; }
    }
  </style>
</head>
<body>

<header class="cs-header">
  <div class="cs-right">
    <button class="cs-btn" id="btn-3d" onclick="toggle3D()">3D VIEW</button>
    <button class="cs-btn" id="btn-copy" data-i18n onclick="copyLink()">Copy Link</button>
    <button class="cs-btn" data-i18n onclick="openProfiles()">Profiles</button>
    <button class="cs-btn" onclick="downloadCompass()">↓ PNG</button>
    <div class="cs-vdiv"></div>
  </div>
</header>

<div style="flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;">
<div class="watch">
  <div class="screen">
    <div class="hdr">
      <span class="home-hint" id="home-hint"></span>
      <div class="axis-info" id="axis-info"></div>
      <div class="hdr-right">
        <span class="warn-chip" data-i18n title="A playful reference tool — not a scientific, professional, or serious political assessment. All placements are impressionistic broad strokes.">⚠ REFERENCE ONLY</span>
        <span class="hdr-tag" data-i18n>12 axes</span>
      </div>
    </div>
    <div class="body">
      <div class="chart-panel"><canvas id="rc" role="img" tabindex="0" aria-label="12-axis political compass chart"></canvas></div>
      <div class="sliders">
        <div class="slider-rows" id="slider-rows"></div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Profiles overlay -->
<div id="prof-overlay" class="prof-overlay">
  <div class="prof-panel">
    <div class="prof-panel-hdr">
      <div>
        <span data-i18n>LOAD PROFILE</span>
        <small data-i18n> · select to auto-fill · for fun &amp; reference, not a serious assessment</small>
      </div>
      <button class="prof-close" data-i18n onclick="closeProfiles()">✕ CLOSE</button>
    </div>
    <div class="prof-search-wrap"><input id="prof-search" type="search" autocomplete="off" spellcheck="false" aria-label="Search profiles"></div>
    <div class="prof-tabs" id="prof-tabs"></div>
    <div class="prof-body">
      <div class="prof-grid" id="prof-grid"></div>
    </div>
  </div>
</div>

<script>
// ── Scale: -3 … +3 (7 steps) ────────────────────────────────────────────────
// -3 Enforce ◄  -2 Suggest ◄  -1 Mind ◄  0 Don't Mind  +1 Mind ►  +2 Suggest ►  +3 Enforce ►
function posLabel(v) {
  return ["ENFORCE ◄","SUGGEST ◄","MIND ◄","DON'T MIND","MIND ►","SUGGEST ►","ENFORCE ►"][v + 3];
}
function levelColor(v) {
  const a = Math.abs(v);
  if (a === 0) return 'var(--mid)';
  if (a === 1) return 'var(--mind)';
  if (a === 2) return 'var(--suggest)';
  return 'var(--enforce)';
}
function levelColorHex(v) {
  const a = Math.abs(v);
  if (a === 0) return C.mid;
  if (a === 1) return C.mind;
  if (a === 2) return C.suggest;
  return C.enforce;
}

let hoverAxis = -1;
const axLabelPos = [];

// ── Axes (name, short label, left pole, right pole, description) ──
const AXES = [
  { name:'ECONOMIC',     s:'ECONOMIC',     icon:'$', l:'Collectivist',      r:'Free Market',     desc:'Collective ownership & central planning vs. private property & free markets. How should resources be organized?' },
  { name:'AUTHORITY',    s:'AUTHORITY',    icon:'★', l:'Civil Libertarian', r:'Authoritarian',   desc:'Maximum personal freedom vs. strong state control. How much power should government hold over citizens?' },
  { name:'SOCIAL',       s:'SOCIAL',       icon:'♦', l:'Progressive',       r:'Traditional',     desc:'Rapidly embrace social reform and change vs. preserve cultural traditions and established institutions.' },
  { name:'IDENTITY',     s:'IDENTITY',     icon:'●', l:'Internationalist',  r:'Nationalist',     desc:'Open borders and global solidarity vs. national sovereignty and cultural preservation first.' },
  { name:'STATE POWER',  s:'STATE POWER',  icon:'▲', l:'Decentral.',        r:'Centralized',     desc:'Local community self-governance vs. unified national or supranational centralized authority.' },
  { name:'ECOLOGY',      s:'ECOLOGY',      icon:'♣', l:'Green',             r:'Industrialist',   desc:'Ecological limits and sustainability as primary concerns vs. economic growth and industrial output.' },
  { name:'RELIGION',     s:'RELIGION',     icon:'†', l:'Secular',           r:'Theocratic',      desc:'Strict separation of church and state vs. governance derived from religious doctrine and values.' },
  { name:'FGN POLICY',   s:'FGN POLICY',   icon:'⚔', l:'Pacifist',          r:'Militarist',      desc:'Diplomacy, non-intervention and disarmament vs. military strength and strategic foreign intervention.' },
  { name:'TECHNOLOGY',   s:'TECHNOLOGY',   icon:'⚙', l:'Precautionary',     r:'Accelerationist', desc:'Cautious tech adoption at human scale vs. rapid innovation, disruption and transhumanist acceleration.' },
  { name:'JUSTICE',      s:'JUSTICE',      icon:'⚖', l:'Rehabilitative',    r:'Punitive',        desc:'Reform offenders and address root social causes vs. retribution, deterrence and strict sentencing.' },
  { name:'ASSIMILATION', s:'ASSIMILATION', icon:'❖', l:'Multicultural',     r:'Assimilationist', desc:'Celebrate distinct, diverse cultural identities vs. integrating all citizens into a unified national culture.' },
  { name:'EPISTEMOLOGY', s:'TRUTH',        icon:'👁', l:'Constructivist',    r:'Essentialist',    desc:'Truth and social roles are socially constructed and fluid vs. truth and human nature are objectively inherent.' }
];
const N = AXES.length;

// ── Profiles: vals in [-3, +3]  (mapped from old -10/+10 scale) ──────────────
// bands: -10..-8→-3  -7..-4→-2  -3..-1→-1  0→0  1..3→+1  4..7→+2  8..10→+3
const PROFILES = [
  //                                                                                ECON AUTH  SOC IDEN  PWR  ECO  REL  FGN TECH  JUS ASIM EPST
  { cat:'hist',  name:'Karl Marx',          tag:'Philosopher, 1818',     vals:[ -3, +2, -3, -3, +3,  0, -3, -2, +2, -2,  -2, -2] },
  { cat:'hist',  name:'Margaret Thatcher',  tag:'UK PM, 1979–90',        vals:[ +3, +2, +3, +3, -1, +2, +2, +2, +2, +3,  +2, +2] },
  { cat:'hist',  name:'Mahatma Gandhi',     tag:'Activist, 1869–1948',   vals:[ -2, -3, -2, -1, -2, -2, +2, -3, -2, -3,  -1, -1] },
  { cat:'hist',  name:'Adolf Hitler',       tag:'Dictator, 1933–45',     vals:[ -1, +3, +3, +3, +3, +1, +1, +3, +2, +3,  +3, +3] },
  { cat:'hist',  name:'Bernie Sanders',     tag:'US Senator, 1941',      vals:[ -2, -1, -2, -2, +1, -2, -2, -2, -1, -2,  -2, -1] },
  { cat:'hist',  name:'Ayn Rand',           tag:'Philosopher, 1905',     vals:[ +3, -3, -1, -1, -3, +2, -3, -2, +3, +2,   0, +3] },
  { cat:'hist',  name:'Mao Zedong',         tag:'Chairman, 1949–76',     vals:[ -3, +3, -2, +3, +3, -1, -3, +2, +1, +3,  +2, -2] },
  { cat:'hist',  name:'Elon Musk',          tag:'Entrepreneur, 1971',    vals:[ +3, -1, +1, +2, -2, +1, -1, -1, +3, +1,  -1, +1] },
  { cat:'hist',  name:'Vladimir Lenin',     tag:'Revolutionary, 1870',   vals:[ -3, +3, -2, +1, +3, +1, -3, +2, +2, +2,  +1, -2] },

function nearestCountry() {
  let best = null, bestD = Infinity;
  for (const c of COUNTRIES) {
    let d = 0;
    for (let i = 0; i < N; i++) d += Math.abs((c.vals[i] ?? 0) - vals[i]);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}
// Show the "at home in …" hint in the header (unless a transient message is flashing).

// ── State ──
let vals = Array(N).fill(0);
const els = [];   // { slider, lp, rp }
let ftrTimer = null;
let loadedProfile = null;   // name of the profile last loaded from the overlay

// ── Canvas palette ──
const C = { dim:'#262626', mid:'#3f3f46', active:'#eab308', bright:'#fbbf24', mind:'#22c55e', suggest:'#eab308', enforce:'#ef4444' };

function pt(i, v, cx, cy, r0, r1) {
  const r = r0 + (v + 3) / 6 * (r1 - r0);
  const a = (i / N) * 2 * Math.PI - Math.PI / 2;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function nGon(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const a = (i / N) * 2 * Math.PI - Math.PI / 2;
    i === 0 ? ctx.moveTo(cx + r*Math.cos(a), cy + r*Math.sin(a))
            : ctx.lineTo(cx + r*Math.cos(a), cy + r*Math.sin(a));
  }
  ctx.closePath();
}

// ── 3D view (icosahedron: 12 vertices ↔ 12 axes) ────────────────────────────
let mode3d = false;
let rotX = -0.35, rotY = 0.55;
let dragging = false, lastPX = 0, lastPY = 0;
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let autoSpin = !REDUCED_MOTION, idleTimer = null, rafLoop = null;

const ICO = (() => {
  const PHI = (1 + Math.sqrt(5)) / 2;
  const raw = [];
  for (const a of [1, -1]) for (const b of [1, -1]) {
    raw.push([0, a, b * PHI], [a, b * PHI, 0], [b * PHI, 0, a]);
  }
  const inv = 1 / Math.hypot(1, PHI);
  const v = raw.map(p => p.map(c => c * inv));
  // top-to-bottom, then by longitude, so axis order reads downward
  v.sort((p, q) => (q[1] - p[1]) || (Math.atan2(p[2], p[0]) - Math.atan2(q[2], q[0])));
  // edge chord ≈ 1.051 on the unit sphere; next-nearest ≈ 1.701
  const edges = [];
  for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
    if (Math.hypot(v[i][0]-v[j][0], v[i][1]-v[j][1], v[i][2]-v[j][2]) < 1.2) edges.push([i, j]);
  }
  const adj = Array.from({ length: 12 }, () => new Set());
  edges.forEach(([i, j]) => { adj[i].add(j); adj[j].add(i); });
  const faces = [];
  for (let i = 0; i < 12; i++) for (const j of adj[i]) if (j > i)
    for (const k of adj[j]) if (k > j && adj[i].has(k)) faces.push([i, j, k]);
  return { v, edges, faces };
})();

function rot3(x, y, z) {
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  return [x1, y * cx - z1 * sx, y * sx + z1 * cx];
}

function draw3d(exportCv) {
  const cv  = exportCv || document.getElementById('rc');
  const ctx = cv.getContext('2d');
  const W   = cv.width;
  const cx  = W / 2, cy = W / 2;
  const r0  = W * 0.055;
  const r1  = W * 0.30;
  const PERSP = 3.2;

  ctx.clearRect(0, 0, W, W);

  const proj = (dir, r) => {
    const [x, y, z] = rot3(dir[0] * r, dir[1] * r, dir[2] * r);
    const s = PERSP / (PERSP - z / (W * 0.5));
    return [cx + x * s, cy - y * s, z];
  };

  // guide: reference icosahedron at mid radius (all axes at DON'T MIND)
  const rMid = r0 + 0.5 * (r1 - r0);
  ctx.strokeStyle = C.dim; ctx.lineWidth = 0.5;
  for (const [i, j] of ICO.edges) {
    const a = proj(ICO.v[i], rMid), b = proj(ICO.v[j], rMid);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }

  // deformed profile: each vertex scaled by its axis value
  const P = AXES.map((_, i) => proj(ICO.v[i], r0 + (vals[i] + 3) / 6 * (r1 - r0)));

  // faces painter-sorted back-to-front, shaded by depth
  const faces = ICO.faces
    .map(f => ({ f, z: (P[f[0]][2] + P[f[1]][2] + P[f[2]][2]) / 3 }))
    .sort((a, b) => a.z - b.z);
  for (const { f, z } of faces) {
    const t = Math.max(0, Math.min(1, (z / r1 + 1) / 2));
    ctx.beginPath();
    ctx.moveTo(P[f[0]][0], P[f[0]][1]);
    ctx.lineTo(P[f[1]][0], P[f[1]][1]);
    ctx.lineTo(P[f[2]][0], P[f[2]][1]);
    ctx.closePath();
    ctx.fillStyle = `rgba(234,179,8,${(0.05 + 0.14 * t).toFixed(3)})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(251,191,36,${(0.25 + 0.55 * t).toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // vertex dots + axis labels, back-to-front
  axLabelPos.length = 0;
  const fs = Math.max(12, Math.round(W * 0.048));
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `600 ${fs}px 'IBM Plex Sans', system-ui, sans-serif`;
  const order = P.map((_, i) => i).sort((a, b) => P[a][2] - P[b][2]);
  for (const i of order) {
    const [x, y, z] = P[i];
    const front = z >= 0;
    ctx.globalAlpha = front ? 1 : 0.35;
    ctx.fillStyle = levelColorHex(vals[i]);
    ctx.beginPath(); ctx.arc(x, y, front ? 2.5 : 2, 0, 2 * Math.PI); ctx.fill();
    const L = proj(ICO.v[i], r0 + (vals[i] + 3) / 6 * (r1 - r0) + W * 0.055);
    axLabelPos[i] = [L[0], L[1]];
    const hov = hoverAxis === i;
    ctx.fillStyle = hov ? C.bright : levelColorHex(vals[i]);
    ctx.fillText(hov ? AXES[i].s : AXES[i].icon, L[0], L[1]);
  }
  ctx.globalAlpha = 1;
}

function loop3d() {
  if (!mode3d) { rafLoop = null; return; }
  if (!dragging && autoSpin) { rotY += 0.004; draw(); }
  rafLoop = requestAnimationFrame(loop3d);
}

function toggle3D() {
  mode3d = !mode3d;
  document.getElementById('btn-3d').textContent = mode3d ? '2D VIEW' : '3D VIEW';
  hoverAxis = -1;
  els.forEach(({ row }) => row.classList.remove('chart-hover'));
  const cv = document.getElementById('rc');
  cv.style.cursor = mode3d ? 'grab' : 'default';
  writeHash();
  try { localStorage.setItem('compass-view', mode3d ? '3d' : '2d'); } catch (e) {}
  draw();
  if (mode3d && !rafLoop) rafLoop = requestAnimationFrame(loop3d);
}

function draw(exportCv) { (mode3d ? draw3d : draw2d)(exportCv); }

function draw2d(exportCv) {
  const cv  = exportCv || document.getElementById('rc');
  const ctx = cv.getContext('2d');
  const W   = cv.width;
  const cx  = W/2, cy = W/2;
  const r0  = W * 0.055;
  const r1  = W * 0.305;
  const rL  = W * 0.415;

  ctx.clearRect(0, 0, W, W);

  // Guide rings
  for (let ring = 0; ring <= 4; ring++) {
    nGon(ctx, cx, cy, r0 + (ring / 4) * (r1 - r0));
    ctx.strokeStyle = ring === 2 ? C.mid : C.dim;
    ctx.lineWidth   = ring === 2 ? 1 : 0.5;
    ctx.stroke();
  }

  // Spokes
  ctx.strokeStyle = C.dim; ctx.lineWidth = 0.5;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * 2 * Math.PI - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a));
    ctx.stroke();
  }

  // Crosshair
  const ch = W * 0.022;
  ctx.strokeStyle = C.dim; ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(cx-ch, cy); ctx.lineTo(cx+ch, cy);
  ctx.moveTo(cx, cy-ch); ctx.lineTo(cx, cy+ch);
  ctx.stroke();

  // Profile fill
  ctx.beginPath();
  for (let i = 0; i < N; i++) { const [x,y] = pt(i,vals[i],cx,cy,r0,r1); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.closePath();
  ctx.fillStyle = 'rgba(234,179,8,0.16)'; ctx.fill();

  // Profile stroke
  ctx.beginPath();
  for (let i = 0; i < N; i++) { const [x,y] = pt(i,vals[i],cx,cy,r0,r1); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.closePath();
  ctx.strokeStyle = C.bright; ctx.lineWidth = 1.5; ctx.stroke();

  // Vertex dots
  ctx.fillStyle = C.bright;
  for (let i = 0; i < N; i++) {
    const [x,y] = pt(i,vals[i],cx,cy,r0,r1);
    ctx.beginPath(); ctx.arc(x, y, 2, 0, 2*Math.PI); ctx.fill();
  }

  // Axis labels (icon by default, abbreviation on hover)
  axLabelPos.length = 0;
  const fs = Math.max(12, Math.round(W * 0.052));
  ctx.font = `600 ${fs}px 'IBM Plex Sans', system-ui, sans-serif`;
  for (let i = 0; i < N; i++) {
    const a = (i/N)*2*Math.PI - Math.PI/2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const x = cx + rL*ca, y = cy + rL*sa;
    axLabelPos.push([x, y]);
    ctx.textAlign    = ca >  0.2 ? 'left'   : ca < -0.2 ? 'right'  : 'center';
    ctx.textBaseline = sa < -0.2 ? 'bottom' : sa >  0.2 ? 'top'    : 'middle';
    const hov = hoverAxis === i;
    ctx.fillStyle = hov ? C.bright : levelColorHex(vals[i]);
    ctx.fillText(hov ? AXES[i].s : AXES[i].icon, x, y);
  }
}

let rafId = null;
function sizeCanvas() {
  const cv = document.getElementById('rc');
  const panel = cv.parentElement;
  const sz = Math.min(panel.clientWidth, panel.clientHeight);
  if (sz <= 0) return;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width  = sz + 'px';
  cv.style.height = sz + 'px';
  cv.width  = Math.round(sz * dpr);
  cv.height = Math.round(sz * dpr);
}

// ── Hash ──
let want3d = false;
function readHash() {
  const h = location.hash.slice(1);
  if (!h) return;
  const p = h.split(',');
  if (p[p.length - 1] === '3d') { want3d = true; p.pop(); }
  if (p.length === N) vals = p.map(v => Math.max(-3, Math.min(3, +v || 0)));
}
function writeHash() { history.replaceState(null, '', '#' + vals.join(',') + (mode3d ? ',3d' : '')); }

// ── Profile matching ──
function closestProfiles() {
  const fictCats = new Set(['anime', 'games', 'film']);
  let bestHist = null, bestFict = null, bestHistD = Infinity, bestFictD = Infinity;
  for (const p of PROFILES) {
    let d = 0;
    for (let i = 0; i < N; i++) d += Math.abs((p.vals[i] ?? 0) - vals[i]);
    if (d === 0 && p.name === loadedProfile) continue;  // don't match the profile you just loaded
    if ((p.cat === 'hist' || p.cat === 'pres' || p.cat === 'thinkers' || p.cat === 'tech') && d < bestHistD) { bestHistD = d; bestHist = p; }
    if (fictCats.has(p.cat)  && d < bestFictD) { bestFictD = d; bestFict = p; }
  }
  return { hist: bestHist, fict: bestFict, histD: bestHistD, fictD: bestFictD };
}
// L1 distance over 12 axes (0–72): within half a step per axis on average → "same as"
function matchLabel(d) { return d <= 6 ? 'SAME AS' : 'ALMOST SAME AS'; }
function refreshMatch() {
  const el = document.getElementById('axis-info');
  if (el.classList.contains('active')) return;
  const { hist, fict, histD, fictD } = closestProfiles();
  el.textContent = (hist ? matchLabel(histD) + ' ' + hist.name.toUpperCase() : '—')
    + '  ·  '
    + (fict ? matchLabel(fictD) + ' ' + fict.name.toUpperCase() : '—');
  const home = nearestCountry();
  document.getElementById('rc').setAttribute('aria-label',
    '12-axis political compass chart.'
    + (hist ? (histD <= 6 ? ' Same as ' : ' Almost same as ') + hist.name.replace(/\.$/, '') + '.' : '')
    + (home ? ' You would feel at home in ' + home.name + '.' : ''));
  refreshHome();
}

// ── Axis info bar ──
function setInfo(idx) {
  const el = document.getElementById('axis-info');
  if (idx < 0) {
    el.classList.remove('active');
    refreshMatch();
  } else {
    el.textContent = AXES[idx].name + ': ' + AXES[idx].desc;
    el.classList.add('active');
  }
}

// ── Slider highlight + position label ──
function updateRow(i) {
  const v = vals[i];
  const col = levelColor(v);
  els[i].lp.classList.toggle('lit', v < 0);
  els[i].rp.classList.toggle('lit', v > 0);
  els[i].lp.style.color = v < 0 ? col : '';
  els[i].rp.style.color = v > 0 ? col : '';
  els[i].posEl.textContent = posLabel(v);
  els[i].posEl.style.color = col;
  els[i].tw.classList.toggle('enforce', Math.abs(v) === 3);
}

// ── Build sliders ──
function buildSliders() {
  const cont = document.getElementById('slider-rows');
  AXES.forEach((ax, i) => {
    const row = document.createElement('div');
    row.className = 'ax';

    const lp = document.createElement('div');
    lp.className = 'pole l'; lp.textContent = ax.l;

    const sc = document.createElement('div'); sc.className = 'sc';

    const an = document.createElement('div');
    an.className = 'an';
    an.title = ax.desc;
    an.addEventListener('mouseenter', () => setInfo(i));
    an.addEventListener('mouseleave', () => setInfo(-1));
    an.addEventListener('click',      () => setInfo(i));
    const axName = document.createElement('span');
    axName.className = 'ax-name'; axName.textContent = ax.name;
    const axPos = document.createElement('span');
    axPos.className = 'ax-pos';
    an.appendChild(axName); an.appendChild(axPos);

    const tw = document.createElement('div'); tw.className = 'tw';
    const ticks = document.createElement('div'); ticks.className = 'ticks';
    for (let t = 0; t < 7; t++) ticks.appendChild(document.createElement('span'));

    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = -3; sl.max = 3; sl.step = 1; sl.value = vals[i];
    sl.setAttribute('aria-label', ax.name);
    sl.addEventListener('input', () => {
      vals[i] = +sl.value; updateRow(i); writeHash(); draw(); refreshMatch();
    });
    sl.addEventListener('wheel', e => {
      e.preventDefault();
      vals[i] = Math.max(-3, Math.min(3, vals[i] + (e.deltaY < 0 ? 1 : -1)));
      sl.value = vals[i]; updateRow(i); writeHash(); draw(); refreshMatch();
    }, { passive: false });

    tw.appendChild(ticks); tw.appendChild(sl);
    sc.appendChild(an); sc.appendChild(tw);

    const rp = document.createElement('div');
    rp.className = 'pole r'; rp.textContent = ax.r;

    els.push({ slider: sl, lp, rp, posEl: axPos, tw, row });
    row.appendChild(lp); row.appendChild(sc); row.appendChild(rp);
    cont.appendChild(row);
    updateRow(i);
  });
}

// ── Profiles panel (tabbed by category) ──
const PROF_CATS = [
  { key:'pres',     label:'Leaders' },
  { key:'hist',     label:'Historical' },
  { key:'thinkers', label:'Thinkers' },
  { key:'tech',     label:'Tech & Business' },
  { key:'anime',    label:'Anime' },
  { key:'games',    label:'Games' },
  { key:'film',     label:'Film / TV' },
];
let activeCat = 'pres';
const tabBtns = [];

function buildProfiles() {
  const tabs = document.getElementById('prof-tabs');
  PROF_CATS.forEach(c => {
    const n = PROFILES.filter(p => p.cat === c.key).length;
    const b = document.createElement('button');
    b.className = 'prof-tab';
    b.innerHTML = c.label + '<small>' + n + '</small>';
    b.onclick = () => { activeCat = c.key; renderProfiles(); };
    tabBtns.push({ key: c.key, btn: b });
    tabs.appendChild(b);
  });
  const input = document.getElementById('prof-search');
  input.placeholder = 'Search ' + PROFILES.length + ' profiles…';
  input.addEventListener('input', renderProfiles);
  renderProfiles();
}

function renderProfiles() {
  const q = (document.getElementById('prof-search').value || '').trim().toLowerCase();
  const searching = q.length > 0;
  tabBtns.forEach(({ key, btn }) => btn.classList.toggle('active', !searching && key === activeCat));
  const grid = document.getElementById('prof-grid');
  grid.innerHTML = '';
  const catLabel = {};
  PROF_CATS.forEach(c => catLabel[c.key] = c.label);
  const list = (searching
    ? PROFILES.filter(p => p.name.toLowerCase().includes(q) || p.tag.toLowerCase().includes(q))
    : PROFILES.filter(p => p.cat === activeCat))
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name));
  list.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'prof-card';
    btn.innerHTML = p.name + '<small>' + p.tag + (searching ? ' · ' + catLabel[p.cat] : '') + '</small>';
    btn.onclick = () => loadProfile(p.name, p.vals);
    grid.appendChild(btn);
  });
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'prof-empty';
    empty.textContent = 'No matches';
    grid.appendChild(empty);
  }
}

function openProfiles()  { document.getElementById('prof-overlay').classList.add('open'); }
function closeProfiles() {
  document.getElementById('prof-overlay').classList.remove('open');
  const input = document.getElementById('prof-search');
  if (input.value) { input.value = ''; renderProfiles(); }
}

document.addEventListener('click', e => {
  const overlay = document.getElementById('prof-overlay');
  if (e.target === overlay) closeProfiles();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProfiles(); });

function loadProfile(name, profileVals) {
  loadedProfile = name;
  vals = profileVals.map(v => Math.max(-3, Math.min(3, v)));
  els.forEach(({ slider }, i) => { slider.value = vals[i]; updateRow(i); });
  writeHash(); draw(); closeProfiles(); refreshMatch();
  // Flash profile name in the header hint
  const hint = document.getElementById('home-hint');
  hint.textContent = 'PROFILE: ' + name.toUpperCase();
  hint.classList.add('flash');
  clearTimeout(ftrTimer);
  ftrTimer = setTimeout(() => {
    hint.classList.remove('flash');
    refreshHome();
  }, 3500);
}

// ── Hash change (back/forward) ──
window.addEventListener('hashchange', () => {
  readHash();
  els.forEach(({ slider }, i) => { slider.value = vals[i]; updateRow(i); });
  draw(); refreshMatch();
});

// ── Init ──
readHash();
buildSliders();
buildProfiles();
writeHash();
refreshMatch();
let saved3d = false;
try { saved3d = localStorage.getItem('compass-view') === '3d'; } catch (e) {}
if (want3d || saved3d) toggle3D();

// Canvas axis-icon hover
const cvEl = document.getElementById('rc');

// 3D drag-to-rotate (pointer events cover mouse + touch)
cvEl.addEventListener('pointerdown', e => {
  if (!mode3d) return;
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
  cvEl.setPointerCapture(e.pointerId);
  autoSpin = false; clearTimeout(idleTimer);
  cvEl.style.cursor = 'grabbing';
});
cvEl.addEventListener('pointermove', e => {
  if (!mode3d || !dragging) return;
  rotY += (e.clientX - lastPX) * 0.01;
  rotX += (e.clientY - lastPY) * 0.01;
  rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));
  lastPX = e.clientX; lastPY = e.clientY;
  draw();
});
['pointerup', 'pointercancel'].forEach(ev => cvEl.addEventListener(ev, () => {
  if (!dragging) return;
  dragging = false;
  cvEl.style.cursor = 'grab';
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!REDUCED_MOTION) autoSpin = true; }, 3000);
}));

// 3D keyboard rotation (canvas is focusable)
cvEl.addEventListener('keydown', e => {
  if (!mode3d) return;
  const step = 0.12;
  if      (e.key === 'ArrowLeft')  rotY -= step;
  else if (e.key === 'ArrowRight') rotY += step;
  else if (e.key === 'ArrowUp')    rotX = Math.min(Math.PI / 2, rotX + step);
  else if (e.key === 'ArrowDown')  rotX = Math.max(-Math.PI / 2, rotX - step);
  else return;
  e.preventDefault();
  autoSpin = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!REDUCED_MOTION) autoSpin = true; }, 3000);
  draw();
});

cvEl.addEventListener('mousemove', e => {
  if (dragging) return;
  const rect = cvEl.getBoundingClientRect();
  const sx = cvEl.width / rect.width, sy = cvEl.height / rect.height;
  const mx = (e.clientX - rect.left) * sx, my = (e.clientY - rect.top) * sy;
  const thr = cvEl.width * 0.08;
  let found = -1;
  for (let i = 0; i < N; i++) {
    if (axLabelPos[i] && Math.hypot(mx - axLabelPos[i][0], my - axLabelPos[i][1]) < thr) { found = i; break; }
  }
  if (found !== hoverAxis) {
    hoverAxis = found; draw();
    els.forEach(({ row }, i) => row.classList.toggle('chart-hover', i === found));
  }
  cvEl.style.cursor = found !== -1 ? 'pointer' : (mode3d ? 'grab' : 'default');
});
cvEl.addEventListener('mouseleave', () => {
  if (hoverAxis !== -1) {
    hoverAxis = -1; draw();
    els.forEach(({ row }) => row.classList.remove('chart-hover'));
    cvEl.style.cursor = mode3d ? 'grab' : 'default';
  }
});

function copyLink() {
  const btn = document.getElementById('btn-copy');
  const done = ok => {
    btn.textContent = ok ? 'Copied ✓' : 'Copy failed';
    setTimeout(() => { btn.textContent = 'Copy Link'; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(location.href).then(() => done(true), () => done(false));
  } else done(false);
}

function downloadCompass() {
  const sz = 900, headH = 96, footH = 96;
  const chart = document.createElement('canvas');
  chart.width = chart.height = sz;
  draw(chart);

  const off = document.createElement('canvas');
  off.width = sz; off.height = headH + sz + footH;
  const ctx = off.getContext('2d');
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, off.width, off.height);
  ctx.drawImage(chart, 0, headH);

  const { hist, fict, histD, fictD } = closestProfiles();
  const home = nearestCountry();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eab308';
  ctx.font = "900 34px 'Red Hat Display', 'IBM Plex Sans', sans-serif";
  ctx.fillText('POLITICAL COMPASS', sz / 2, 48);
  ctx.fillStyle = '#52525b';
  ctx.font = "13px 'IBM Plex Mono', monospace";
  ctx.fillText('COMPASS.CARINO.SYSTEMS · 12 AXES · REFERENCE ONLY', sz / 2, 76);
  ctx.fillStyle = '#fbbf24';
  ctx.font = "600 17px 'IBM Plex Sans', sans-serif";
  ctx.fillText((hist ? matchLabel(histD) + ' ' + hist.name.toUpperCase() : '—')
    + '  ·  ' + (fict ? matchLabel(fictD) + ' ' + fict.name.toUpperCase() : '—'), sz / 2, headH + sz + 34);
  if (home) {
    ctx.fillStyle = '#eab308';
    ctx.fillText('YOU WOULD FEEL AT HOME IN ' + home.flag + ' ' + home.name.toUpperCase(), sz / 2, headH + sz + 64);
  }

  const slug = hist ? hist.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') : 'profile';
  const link = document.createElement('a');
  link.download = 'compass-' + slug + '.png';
  link.href = off.toDataURL('image/png');
  link.click();
}

window.addEventListener('load', () => {
  requestAnimationFrame(() => { sizeCanvas(); draw(); document.fonts.ready.then(() => draw()); });
});
window.addEventListener('resize', () => {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => { sizeCanvas(); draw(); rafId = null; });
});
</script>
